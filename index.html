<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Vivalink TEST</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1d2733;--mut:#6a7686;--bd:#e1e5ea;--ac:#0f766e;--act:#fff;--ok:#1b7a43;--warn:#a15c00;--bad:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--card:#19212b;--tx:#e8edf3;--mut:#93a0b0;--bd:#2a3542;--ok:#4cc27f;--warn:#e0a03a;--bad:#f07b70}}
:root[data-theme="dark"]{--bg:#10151c;--card:#19212b;--tx:#e8edf3;--mut:#93a0b0;--bd:#2a3542;--ok:#4cc27f;--warn:#e0a03a;--bad:#f07b70}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:640px;margin:0 auto;padding:16px 14px 96px}
h1{font-size:22px;margin:4px 0 2px;letter-spacing:-.01em}h2{font-size:17px;margin:20px 0 8px}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:8px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 6px;text-align:center}button.stat{font:inherit;color:inherit;width:100%;margin:0;display:block}.stat.st-warn b{color:var(--warn)}
.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--mut);display:block;overflow-wrap:anywhere;hyphens:auto}@media (max-width:340px){.ed .abar{gap:5px}.ed .abar button{font-size:13px;padding-left:3px;padding-right:3px}.stats{gap:5px}.stat{padding:8px 3px}.stat span{font-size:11px}}
.rec{border-left:4px solid var(--mut);padding-left:12px}.rec.bad{border-color:var(--bad)}.rec.warn{border-color:var(--warn)}.rec.ok{border-color:var(--ok)}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:9px 14px;min-height:44px}
button.p{background:var(--ac);color:var(--act);border-color:var(--ac);font-weight:600}
button.s{min-height:36px;padding:5px 11px;font-size:14px}
input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);margin:3px 0 10px}
textarea{min-height:90px}label{font-size:14px;color:var(--mut)}
.chip{display:inline-block;font-size:13px;padding:2px 9px;border-radius:99px;border:1px solid var(--bd);color:var(--mut)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}.chips button{white-space:nowrap;min-height:34px;padding:4px 12px;font-size:14px}
.chips button.on{background:var(--ac);color:var(--act);border-color:var(--ac)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;border-radius:0;background:none;color:var(--mut);font-size:12px;letter-spacing:-.1px;padding:0 1px;white-space:nowrap;min-height:54px}nav button.on{color:var(--ac);font-weight:700}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}.sheet[hidden]{display:none}
.sheet>div{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 14px calc(20px + env(safe-area-inset-bottom,0px))}
.done{text-decoration:line-through;color:var(--mut)}.old{opacity:.65}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:99px;z-index:30;font-size:14px;display:none}
.tl{border-left:2px solid var(--bd);margin-left:6px;padding-left:12px}.card p{white-space:pre-wrap}.lnk{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1px solid var(--bd);border-radius:10px;color:var(--tx);text-decoration:none;background:var(--card)}
.thumb{width:72px;min-width:72px;height:90px;border-radius:8px;overflow:hidden;background:var(--bd)}.thumb canvas{width:100%;height:100%;object-fit:cover;display:block}
[hidden]{display:none!important}.ed .edhead{position:sticky;top:-16px;margin:-16px -14px 8px;padding:12px 14px 6px;background:var(--bg);z-index:2;border-bottom:1px solid var(--bd)}.edtabs{margin:8px 0 0;overflow-x:auto;flex-wrap:nowrap}.edtabs button{white-space:nowrap}
.ed .abar{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom,0px));margin:14px -14px calc(-20px - env(safe-area-inset-bottom,0px));padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--bd);display:flex;gap:8px;align-items:center;justify-content:flex-end;z-index:2}.ed .abar button{flex:1 1 0;min-width:0;max-width:200px;margin:0;padding-left:6px;padding-right:6px;overflow:hidden;text-overflow:ellipsis}.st-dirty{color:var(--warn);border-color:var(--warn);white-space:nowrap}
@media (min-width:900px){.sheet.wide>div{max-width:1100px}.sheet.wide .edwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}.sheet.wide [data-panel=vorschau]{display:block!important;grid-column:1;grid-row:1 / span 4;position:sticky;top:110px}.sheet.wide [data-panel]:not([data-panel=vorschau]){grid-column:2}.sheet.wide .edtabs button[data-id=vorschau]{display:none}.sheet.wide .prev canvas{width:90%}}
.prev{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 0}.prev canvas{flex:none;width:80%;max-width:420px;height:auto;border-radius:12px;border:1px solid var(--bd);scroll-snap-align:center}
.st-geplant{color:var(--ok);border-color:var(--ok)}.st-faellig{color:#fff;background:var(--ok);border-color:var(--ok)}.st-wichtig{color:var(--warn);border-color:var(--warn)}.st-veroeffentlicht{color:var(--ac);border-color:var(--ac)}.st-abgelehnt{opacity:.6}
.bar{height:10px;border-radius:5px;background:var(--bd);overflow:hidden;margin-top:6px}.bar span{display:block;height:100%;background:linear-gradient(90deg,#FA0372,#6203DD,#FE6603)}
.testbar{background:#b45309;color:#fff;font-weight:700;font-size:14px;text-align:center;border-radius:10px;padding:8px 10px;margin:0 0 10px}
</style>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="VL Test"><meta name="theme-color" content="#b45309">
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<div class="sheet" id="sheet" hidden></div>
<div id="toast"></div>
<script src="js/config.js?v=2.4.0"></script>
<script src="js/core.js?v=2.4.0"></script>
<script src="js/data.js?v=2.4.0"></script>
<script src="js/metrics.js?v=2.4.0"></script>
<script src="js/actions.js?v=2.4.0"></script>
<script src="js/rules.js?v=2.4.0"></script>
<script src="js/studio.js?v=2.4.0"></script>
<script src="js/advice.js?v=2.4.0"></script>
<script src="js/manage.js?v=2.4.0"></script>
<script src="js/render.js?v=2.4.0"></script>
<script src="js/prompts.js?v=2.4.0"></script>
<script src="js/aitest.js?v=2.4.0"></script>
<script src="js/views.js?v=2.4.0"></script>
<script src="js/studio-view.js?v=2.4.0"></script>
<script src="js/diag.js?v=2.4.0"></script>
<script src="js/sync.js?v=2.4.0"></script>
<script src="js/autonomy.js?v=2.4.0"></script>
<script src="js/kpi.js?v=2.4.0"></script>
<script src="js/demo.js?v=2.4.0"></script>
<script src="js/app.js?v=2.4.0"></script>
</body>
</html>
